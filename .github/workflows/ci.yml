name: Build and unit tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Unit tests (no system input or AX access)
        run: bash scripts/test.sh
      - name: Universal Release
        run: bash scripts/build.sh Release
      - name: Inspect architectures and linkage
        run: |
          app=build/DerivedData/Build/Products/Release/FinderWrap.app/Contents/MacOS/FinderWrap
          architectures=$(lipo "$app" -archs)
          for architecture in arm64 x86_64; do
            [[ " $architectures " == *" $architecture "* ]] || exit 1
          done
          otool -l "$app"
          otool -L "$app"
      - name: Shell syntax
        run: for script in scripts/*.sh; do bash -n "$script"; done
# No signing secrets, upload, Release creation or keyboard simulation in CI.
